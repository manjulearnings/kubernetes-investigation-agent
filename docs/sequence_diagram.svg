<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%">
  <defs>
    <linearGradient id="seq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="seq-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="seq-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="seq-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="seq-arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="860" rx="16" fill="url(#seq-bg)"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">
      ⏱️ End-to-End Execution Sequence Diagram
    </text>
    <text y="22" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">
      Interaction sequence between CLI, Log Parser, Diagnostic Engine, Gemini AI, and Reporters
    </text>
  </g>

  <!-- LIFELINES (Columns) -->
  <!-- 1. CLI (x=110) -->
  <!-- 2. Parser (x=240) -->
  <!-- 3. Engine (x=380) -->
  <!-- 4. Patterns (x=510) -->
  <!-- 5. Agent (x=630) -->
  <!-- 6. Gemini (x=750) -->
  <!-- 7. Google API (x=880) -->

  <!-- Lifeline Headers -->
  <!-- Header 1: User / CLI -->
  <g transform="translate(60, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">User / CLI</text>
  </g>
  <line x1="110" y1="127" x2="110" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 2: LogParser -->
  <g transform="translate(190, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">LogParser</text>
  </g>
  <line x1="240" y1="127" x2="240" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 3: Engine -->
  <g transform="translate(330, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#818cf8">Engine</text>
  </g>
  <line x1="380" y1="127" x2="380" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 4: Patterns -->
  <g transform="translate(460, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#34d399">patterns.py</text>
  </g>
  <line x1="510" y1="127" x2="510" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 5: Agent Façade -->
  <g transform="translate(580, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">agent.py</text>
  </g>
  <line x1="630" y1="127" x2="630" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 6: Gemini Bridge -->
  <g transform="translate(700, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">gemini.py</text>
  </g>
  <line x1="750" y1="127" x2="750" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Header 7: Google Cloud API -->
  <g transform="translate(830, 85)" filter="url(#seq-shadow)">
    <rect width="100" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ec4899">Google Cloud</text>
  </g>
  <line x1="880" y1="127" x2="880" y2="800" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- MESSAGE 1: CLI -> Parser -->
  <g transform="translate(0, 155)">
    <line x1="110" y1="0" x2="235" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow)"/>
    <text x="172" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">1. parse_text(raw_logs)</text>
  </g>

  <!-- SELF ACTIVATION on Parser -->
  <g transform="translate(240, 175)">
    <path d="M 0 0 L 25 0 L 25 22 L 0 22" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="32" y="16" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Stitch stack traces &amp; parse CRI/JSON</text>
  </g>

  <!-- MESSAGE 2: Parser -> Agent -->
  <g transform="translate(0, 220)">
    <line x1="240" y1="0" x2="625" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-arrow-dashed)"/>
    <text x="435" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">2. Returns List[LogEntry]</text>
  </g>

  <!-- MESSAGE 3: Agent -> Engine -->
  <g transform="translate(0, 255)">
    <line x1="630" y1="0" x2="385" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow)"/>
    <text x="507" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#e2e8f0">3. analyze(entries)</text>
  </g>

  <!-- MESSAGE 4: Engine -> Patterns -->
  <g transform="translate(0, 290)">
    <line x1="380" y1="0" x2="505" y2="0" stroke="#34d399" stroke-width="2" marker-end="url(#seq-arrow-green)"/>
    <text x="445" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#34d399">4. Match K8S_SIGNATURES</text>
  </g>

  <!-- MESSAGE 5: Patterns -> Engine -->
  <g transform="translate(0, 325)">
    <line x1="510" y1="0" x2="385" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-arrow-dashed)"/>
    <text x="445" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">5. Matched signatures or None</text>
  </g>

  <!-- ALT BOX: Known Pattern vs Unknown Error -->
  <g transform="translate(80, 360)">
    <rect width="840" height="340" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#475569" stroke-width="1.5"/>
    <rect width="70" height="24" rx="4" fill="#334155"/>
    <text x="35" y="16" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">ALT</text>

    <!-- Branch 1: Pattern Matched -->
    <g transform="translate(20, 35)">
      <text font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#34d399">
        [Case A: Pattern Matched (e.g. OOMKill, DB Down, DNS NXDOMAIN)]
      </text>
      <!-- Engine to Agent -->
      <line x1="280" y1="25" x2="545" y2="25" stroke="#34d399" stroke-width="2" marker-end="url(#seq-arrow-green)"/>
      <text x="412" y="17" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#a7f3d0">
        Deterministic Report with kubectl commands (1.5ms)
      </text>
    </g>

    <!-- Divider line -->
    <line x1="0" y1="85" x2="840" y2="85" stroke="#334155" stroke-dasharray="6 6" stroke-width="1.5"/>

    <!-- Branch 2: Pattern Not Found -->
    <g transform="translate(20, 105)">
      <text font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">
        [Case B: Pattern Not Found in patterns.py (Custom Stack Trace / Application Panic)]
      </text>

      <!-- Step B1: Engine flags unclassified -->
      <line x1="280" y1="30" x2="545" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-arrow-dashed)"/>
      <text x="412" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#cbd5e1">
        Preliminary Report (category: APPLICATION_PANIC / APPLICATION_ERROR)
      </text>

      <!-- Step B2: Agent calls Gemini -->
      <line x1="550" y1="65" x2="665" y2="65" stroke="#c084fc" stroke-width="2" marker-end="url(#seq-arrow-purple)"/>
      <text x="607" y="57" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#e9d5ff">
        diagnose_unknown_failure(report)
      </text>

      <!-- Step B3: Gemini calls Google Cloud -->
      <line x1="670" y1="105" x2="795" y2="105" stroke="#ec4899" stroke-width="2" marker-end="url(#seq-arrow)"/>
      <text x="732" y="97" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#f472b6">
        HTTPS POST gemini-1.5-flash (Stack Trace + Schema)
      </text>

      <!-- Step B4: Google Cloud responds -->
      <line x1="800" y1="145" x2="675" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-arrow-dashed)"/>
      <text x="737" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#cbd5e1">
        JSON: { root_cause, explanation, remediation_plan }
      </text>

      <!-- Step B5: Gemini updates report -->
      <path d="M 670 170 L 690 170 L 690 190 L 670 190" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <text x="696" y="185" font-family="Segoe UI, sans-serif" font-size="10" fill="#d8b4fe">Overwrites title &amp; remediation with AI diagnosis</text>

      <!-- Step B6: Gemini returns to Agent -->
      <line x1="670" y1="210" x2="555" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-arrow-dashed)"/>
      <text x="612" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#cbd5e1">
        Returns Enriched InvestigationReport
      </text>
    </g>
  </g>

  <!-- FINAL STEP: Agent -> CLI Output -->
  <g transform="translate(0, 740)">
    <line x1="630" y1="0" x2="115" y2="0" stroke="#34d399" stroke-width="2.5" marker-end="url(#seq-arrow-green)"/>
    <text x="372" y="-10" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#34d399">
      Print Rendered Report (Rich Terminal / Markdown / JSON)
    </text>
  </g>

  <!-- Bottom status bar -->
  <g transform="translate(50, 810)">
    <text font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">
      💡 Result: 100% deterministic local rules run in &lt;2ms. Unclassified application errors are seamlessly solved by Gemini AI.
    </text>
  </g>
</svg>
